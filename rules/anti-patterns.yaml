# Anti-pattern catalog - the 22 documented shapes that get an audit finding rejected.
#
# This file is DATA, not code. Every entry is a generic detection heuristic; none
# names a target, chain, ecosystem or program. Ecosystem-specific tokens live in
# rules/packs/ and are never inlined here, so a rule's presence reveals nothing
# about which ecosystems the author works on.
#
# Schema per entry:
#   id             - stable identifier (P1..P22)
#   title          - one line
#   group          - A: impact absent | B: precondition disallowed | C: harm bounded
#                    D: already known      | E: report fails
#   verdict        - hard (KILL) | soft (HOLD) | warn (note only)
#   weight         - how much this subtracts from the 100-point viability estimate
#   any_of         - list of regexes; at least ONE must match for the rule to fire
#   all_of         - optional; ALL must also match
#   none_of        - optional; if ANY matches, the rule is suppressed
#   none_of_scope  - "document" (default) or "sentence"
#   ignore_sections- section kinds to skip: poc | claim | other
#   escalate_on    - strong forms; when one matches, the rule carries escalate_to
#   escalate_to    - verdict to use when escalate_on matched (default: hard)
#   downgrade_on   - weak forms; a match here is dropped, so the rule does not fire
#   structural     - dispatch to a hand-written structural matcher
#   negation_aware - whether the engine's negation window applies (default: true)
#   fix            - the corrective action
#   doc            - public documentation page for this rule
#   origin_rows    - log rows this rule was derived from. 0 = not measured.
#   evidence       - in_sample | none
#   last_validated - ISO date the fixtures were last run
#   fp_rate        - false-positive rate, or null. UNMEASURED: there is no
#                    accepted/paid control set yet, so this is null for every rule
#                    and stays null until one exists. See docs/control-set.md.
#
# Calibration note: these are priors from one researcher's rejection log, not a
# classifier. A rule firing is a prompt to check, not a verdict. Over-filtering is
# itself a documented failure mode (see P22's own history).
#
# Provenance honesty: origin_rows is a count of log rows the rule was DERIVED
# from, which is not the same as a validated detection rate.
#
# HOW EVERY origin_rows VALUE HERE IS DERIVED - no value is an estimate, and no
# value is invented. Each one is a count over the public rejection dataset in the
# sibling repository rejection-taxonomy (data/rejections.csv, 97 rows), using the
# rule's own token in a published column:
#
#   earliest_gate      the rule has its own gate token in the log
#   root_cause_class   the rule maps to exactly one published root-cause class
#   bug_family         the rule maps to exactly one published bug family
#
# Reproduce the whole table with:
#
#   cd rejection-taxonomy
#   python -c "import csv,collections; \
#     rows=list(csv.DictReader(open('data/rejections.csv',encoding='utf-8'))); \
#     print(collections.Counter(r['earliest_gate'] for r in rows)); \
#     print(collections.Counter(r['root_cause_class'] for r in rows)); \
#     print(collections.Counter(r['bug_family'] for r in rows))"
#
# A rule with NO public token gets origin_rows: 0 and evidence: none. That is
# not a claim that the rule is unfounded - it is the honest statement that the
# public record does not carry a row count for it, and this file will not
# manufacture one. The published bucket totals are cited in README.md.

version: 1

rules:
  # ---------------------------------------------------------------- Group A
  - id: P1
    title: Admitted non-exploit
    group: A
    verdict: hard
    weight: 40
    any_of:
      - "not currently (exploitable|possible|reachable|an issue)"
      - "currently blocks? (the|this|any)"
      - "would become (exploitable|a vulnerability|critical)"
      - "if the protocol (were to |)(upgrade|change|migrate)"
      - "no (current|present) (exploit|attack) path"
    # "hypothetical" alone is a hedge, not an admission. It is the single most
    # common word in a report that is merely being careful, so it must not kill
    # the submission on its own. It still fires, as a note, so the writer sees it.
    escalate_on:
      - "(no|not|never) (current|present|real) (exploit|attack|impact) path"
      - "not currently (exploitable|reachable|an issue)"
    escalate_to: hard
    fix: >-
      File at the severity matching the CURRENT state. If no exploit path exists
      today, the finding is theoretical: hold it in notes.
    doc: docs/rules/P1.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P6
    title: Theoretical future-upgrade framing filed at Critical
    group: A
    verdict: hard
    weight: 40
    any_of:
      - "current protection is (accidental|incidental)"
      - "fragile coupling"
      - "if a future (upgrade|version|release)"
      - "once (they|the team) (upgrade|migrate|change)"
      - "assumes? no future (change|upgrade)"
    fix: >-
      File at the severity matching current impact. A missing guard with implicit
      protection is Medium or Informational, not Critical.
    doc: docs/rules/P6.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P12
    title: Panic or revert without persisted impact
    group: A
    verdict: soft
    weight: 30
    all_of:
      # The failure-marker list is ECOSYSTEM-NEUTRAL on purpose. A language's own
      # test attribute belongs in rules/packs/, not in the catalog embedded in the
      # binary: a catalog that names one language's marker tells every reader
      # which ecosystem the author works on. See scripts/check_tripwires.py.
      - "(revert|panic|abort|assert(ion)? fail|div(ision)? by zero)"
    any_of:
      - "direct fund loss:? *(none|no)"
      - "read[- ]only"
      - "view function"
      - "no (state|storage) (change|mutation)"
      - "the (transaction|call) (reverts|aborts|panics)"
      - "gas only"
    fix: >-
      Demonstrate a state-mutation consequence of the panic. Without one, ask what
      state exists AFTER the revert that did not exist before. If nothing: hold.
    doc: docs/rules/P12.md
    origin_rows: 5
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P13
    title: '"Inconsistent state" without a quantified fund-flow delta'
    group: A
    verdict: soft
    weight: 25
    any_of:
      - "inconsistent state"
      - "accounting drift"
      - "ordering dependency"
      - "violates? (the )?invariant"
      - "state (desync|divergence)"
    none_of:
      # A quantified delta answers the rule's own objection, so it suppresses it.
      # These are deliberately ECOSYSTEM-NEUTRAL: a number followed by a generic
      # unit, or by any ticker-shaped symbol, or a precise decimal figure. Naming
      # specific chains or tokens here would leak which ecosystems the author
      # works on, and that is exactly what rules/packs/ exists to avoid.
      - "(loss|delta|difference|discrepancy) of \\d"
      - "\\$\\d"
      - "\\b\\d+(\\.\\d+)? ?(tokens?|base units?|units?|wei|gwei|shares?)\\b"
      - "\\b\\d+\\.\\d{2,}\\b"
      - "\\b\\d[\\d,]* ?[A-Z]{2,6}\\b"
    fix: >-
      Quantify exactly what changes, in token units or value, between the healthy
      and the exploited state. Sub-cent or cosmetic -> Informational at most.
    doc: docs/rules/P13.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  # ---------------------------------------------------------------- Group B
  - id: P2
    title: Privileged-role-gated against a program exclusion
    group: B
    verdict: hard
    weight: 40
    any_of:
      - "only(owner|admin|operator|guardian|governor)"
      # Prose forms. The old pattern missed "only the owner" entirely, because
      # the identifier had to be glued to the word "only".
      - "only (the |an? )?(owner|admin|operator|guardian|governor|curator|manager)"
      - "(admin|operator|curator|manager|owner)[ _]?(cap|capability|role|privilege)"
      - "(admin|operator|owner|governor|guardian) (can|may|could|is able to|has the (power|ability))"
      - "requires? (the |a |an )?(privileged|trusted|admin|elevated) (role|actor|address|signer|action)"
      - "access[- ]control(led)? by (the |)(owner|admin)"
      - "capability[- ]gated"
      - "set by (the |)(admin|owner|operator)"
    # Suppression is SENTENCE-scoped and must be evidence that an UNPRIVILEGED
    # path exists. The old form let one "permissionless" anywhere in the document
    # switch the rule off, which is exactly backwards: the escape hatch has to
    # apply to the same sentence that named the privileged role.
    none_of_scope: sentence
    none_of:
      - "unprivileged (escalation|path|attacker) (is |was |)(demonstrated|shown|proven)"
      - "any (user|caller|attacker) can (trigger|call|invoke|reach)"
      - "permissionless"
      - "without (any )?(privileged|elevated|admin) (role|access|capability)"
    fix: >-
      Check whether an unprivileged attacker can trigger the bug without role
      compromise. If not: hold. The one escape is UNKNOWING admin harm - a
      reasonable admin action with a non-obvious destructive second-order effect.
    doc: docs/rules/P2.md
    origin_rows: 3
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P3
    title: Front-run-only or operator-delay dependency
    group: B
    verdict: hard
    weight: 35
    any_of:
      - "front[- ]?run"
      - "mempool"
      - "before the operator (calls|updates|acts)"
      - "operator (delay|fails to act|failing to act)"
      - "race (condition )?against"
      - "sandwich"
    none_of:
      - "atomic(ally)? (in )?(one|a single) transaction"
      - "flash ?loan"
      - "same transaction"
    fix: >-
      Find an atomic trigger path (flash loan, multicall, composed legos) or hold.
      The front-run exclusion stops applying once the attack fits in one tx.
    doc: docs/rules/P3.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P5
    title: Out-of-scope file primitive
    group: B
    verdict: hard
    weight: 35
    any_of:
      - "outside (the )?(scope|sources|src)"
      - "off[- ]chain (component|logic|handler|service|node)"
      - "not in the (scoped|in-scope) (file|tree|list)"
      - "root cause (is|lies|sits) outside"
    # A path match inside the PoC section is the PoC's own scaffolding, not the
    # finding's root cause. The old form matched a path under the test tree and
    # killed the report for citing its own test file.
    ignore_sections: [poc]
    fix: >-
      Trace the ROOT CAUSE, not the impact site. If the root cause lives outside
      the scoped tree, the finding is out of scope regardless of impact.
    doc: docs/rules/P5.md
    origin_rows: 4
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P11
    title: Testnet-only finding at Critical tier
    group: B
    verdict: hard
    weight: 35
    any_of:
      - "testnet[- ]only"
      - "(only|just) (reproduced|demonstrated|verified) on (the )?testnet"
      - "mainnet (is|deployment is) (unaffected|not at risk|different)"
      - "not (derivable|present) on mainnet"
    fix: >-
      Verify mainnet impact exists. If not, do not submit as Critical.
    doc: docs/rules/P11.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P20
    title: Requires a cooperating party
    group: B
    verdict: soft
    weight: 30
    any_of:
      - "cooperating (party|lp|user|counterparty)"
      - "requires? (the |a )?(victim|user|lp|counterparty) to (act|cooperate|sabotage)"
      - "if (an|the) lp (exits|withdraws) (mid|during)"
      - "governance proposal (must |)(pass|be submitted|be voted)"
      - "requires? (another|a third) party"
    fix: >-
      Ask: can ONE unprivileged attacker acting alone trigger the full impact?
      Solo-triggerability is the line between a bug and a story.
    doc: docs/rules/P20.md
    origin_rows: 1
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null

  # ---------------------------------------------------------------- Group C
  - id: P7
    title: Best-practice or convention critique
    group: C
    verdict: soft
    weight: 30
    any_of:
      - "best[- ]practice"
      - "(industry|common|standard) (practice|convention|implementation)"
      - "should (use|be|follow) (>=|<=|the standard)"
      - "deviat(es|ion) from"
      - "(gas|optimisation|optimization|style) (improvement|suggestion|issue)"
      - "inconsistent with (the )?convention"
    fix: >-
      Either demonstrate fund loss attributable to the specific deviation, or hold.
      Most programs exclude best-practice critiques in almost these words.
    doc: docs/rules/P7.md
    origin_rows: 1
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P16
    title: Severity mismatch with the program payout floor
    group: C
    verdict: hard
    weight: 40
    any_of:
      - "below (the )?(payout )?(floor|threshold|tier)"
      - "(critical|high)[- ]only (program|track)"
      - "no (medium|low) (payout|reward|tier)"
      - "pays? (only )?(critical|high)"
    fix: >-
      Hold. The finding may be valid but the program's economic structure does not
      pay for this severity. Save it for a program that does.
    doc: docs/rules/P16.md
    origin_rows: 2
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P18
    title: Known characteristic documented in a prior audit
    group: C
    verdict: hard
    weight: 40
    any_of:
      # The bare phrase "prior audit" is NOT here on purpose. "The prior audit
      # missed this" is the opposite signal - it says the surface is new - and
      # the old rule hard-killed it. A prior-audit match now requires a
      # previously/already statement or a named source.
      - "previously (reported|identified|reviewed|raised|accepted|assessed)"
      - "already (reported|known|acknowledged|accepted|covered|raised)"
      - "known (issue|limitation|characteristic|design)"
      - "(prior|earlier|previous) audit .{0,40}(covered|identified|accepted|reported|raised)"
      - "documented (as |)(intended|design)"
    none_of:
      # Negated forms are the OPPOSITE signal: they say the surface is NEW.
      - "no prior audit"
      - "not (covered|found|identified) (by|in) (a |any )?prior"
      - "no (known|previously)"
      - "not previously"
      - "new since"
      - "first (audit|review) of"
      - "(prior|earlier|previous) audit .{0,40}(missed|did not cover|does not cover|never covered)"
    fix: >-
      Do not submit. Prior audit findings are part of the public record; submitting
      a known design characteristic signals you did not read the prior audit.
    doc: docs/rules/P18.md
    origin_rows: 1
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P21
    title: Realistic-configuration mismatch
    group: C
    verdict: soft
    weight: 30
    any_of:
      - "at the documented (configuration|stablecoin|setting)"
      - "no misconfiguration"
      - "not how (it|the protocol) is (run|deployed|configured)"
      - "assuming (the |a )?(non[- ]standard|unusual|non[- ]default) config"
      - "if the (operator|maker|admin) (chooses|sets|ships)"
      - "under the deployed configuration"
    fix: >-
      Name at least one bound representative of the deployed configuration. If no
      bound is representative, the headline cannot set severity.
    doc: docs/rules/P21.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P22
    title: Primitive-vs-product confusion
    group: C
    verdict: soft
    weight: 25
    any_of:
      - "economically rational"
      - "permitted by the guards?"
      - "the maker (must|could|would) (choose|deploy|author)"
      - "no (deployed|shipped|documented) (instance|strategy|consumer)"
      - "a design choice no deployed"
      - "no permissionless consumer"
    none_of:
      # Positive deployment evidence suppresses the rule. These must require an
      # ASSERTION that a deployment exists - a bare "deployed instance" would also
      # match "no deployed instance exists", which is the opposite signal.
      - "a deployed (instance|strategy|consumer)[^.]{0,40}(exists|exhibits|shows|demonstrates)"
      - "the deployed (instance|strategy|configuration)[^.]{0,40}(exhibits|shows|demonstrates)"
      - "shipped in the"
    fix: >-
      Name the real deployment the attack needs, or downgrade the claim to the
      primitive layer. A primitive unsafe in a configuration nobody runs is not a
      product vulnerability.
    doc: docs/rules/P22.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  # ---------------------------------------------------------------- Group D
  - id: P15
    title: Intended behaviour asserted in the project's own test suite
    group: D
    verdict: hard
    weight: 40
    any_of:
      - "by design"
      - "intended (behaviou?r|design)"
      - "should preserve"
      - "expected to survive"
      - "not penalised"
      - "(test|spec) (asserts|asserting|validates) (this|the behaviou?r)"
    none_of:
      # These are the STRONGEST forms of the finding, and the old rule killed
      # them: "the implementation contradicts the documented behaviour" matched
      # the bare phrase "documented behaviour" and hard-failed.
      - "contradicts? (the )?documented"
      - "violates? (the )?documented"
      - "diverges? from (the )?documented"
      - "inconsistent with (the )?documented"
      - "not (the )?documented behaviou?r"
      - "documented behaviou?r (is|says|states) .{0,30}(but|however|yet)"
    # A bare "documented behaviour" is a claim about the docs, not proof of
    # intent. It fires as a NOTE so the writer sees it, without killing the report.
    escalate_on:
      - "(test|spec) (asserts|asserting|validates) (this|the behaviou?r)"
      - "asserted (as )?(intended|by design)"
      - "the (project|team)('s)? own test"
    escalate_to: hard
    fix: >-
      Read the test. If it validates the behaviour as design intent, do NOT submit.
      This is Not Applicable, not Informational - a materially worse outcome.
    doc: docs/rules/P15.md
    origin_rows: 1
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null

  # ---------------------------------------------------------------- Group E
  - id: P4
    title: Defective PoC
    group: E
    # Hard only when the report SAYS the PoC is not the real thing. A mock used
    # as ordinary scaffolding is not a defective PoC, and the old case-insensitive
    # "[A-Z]" made "stubborn" and "mocked" fire.
    verdict: warn
    weight: 40
    any_of:
      - "assert!\\(\\s*\\w+\\s*>=\\s*0\\s*\\)"
      - "assert\\(\\s*\\w+\\s*>=\\s*0\\s*\\)"
      - "(?-i:\\b(Mock|Simulator|Fake|Stub)[A-Z]\\w*)"
      - "imports? a (mock|simulator)"
    # Ordinary PoC scaffolding. A match here is dropped: naming a mock token is
    # not evidence that the PoC is defective.
    downgrade_on:
      - "(?-i:\\bMock(ERC20|Token|Vault|Router|Pair|Factory)\\b)"
      - "(?-i:\\bStub[A-Z]\\w*\\b)"
    escalate_on:
      - "instead of the real (contract|implementation|deployment)"
      - "simulates? the (contract|protocol|behaviou?r)"
      - "not the (real|deployed|in-scope) contract"
      - "mock(ed)? (the )?(contract|implementation) rather than"
    escalate_to: hard
    fix: >-
      Rewrite the PoC to (a) import the real in-scope contract, (b) assert the
      harmful state delta, and (c) resolve every path against a fresh clone at the
      exact commit.
    doc: docs/rules/P4.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P9
    title: Wrong line numbers or unverified paths
    group: E
    verdict: hard
    weight: 35
    any_of:
      - "line numbers? (corrected|were wrong|updated from|have been fixed)"
      - "originally referenced"
      - "the original (submission|report) referenced"
      - "line numbers? (may|might) (have )?(drift|differ)"
    fix: >-
      Re-clone the scope commit, grep every function reference, and update ALL line
      numbers before submission. A wrong line number is a credibility failure that
      taints an otherwise correct finding.
    doc: docs/rules/P9.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P8
    title: Self-contradicting severity or impact sections
    group: E
    verdict: soft
    weight: 30
    any_of:
      # "Severity rationale" is the STANDARD heading of a good report. The old
      # rule fired on it, which meant every well-structured report tripped P8.
      - "might be (rejected|considered out of scope)"
      - "could (work|be exploitable) by accident"
      - "this (may|might) not (be|qualify)"
      - "however, this (is|may be) (out of scope|invalid)"
      - "arguably"
    fix: >-
      Pick one impact scenario and remove the hedge content. If doubt exists, fix
      the report - do not embed the doubt in it.
    doc: docs/rules/P8.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P10
    title: Hypothetical TVL-scaling tables
    group: E
    verdict: warn
    weight: 10
    any_of:
      - "(TVL|total value locked) \\| "
      - "extrapolat(e|ed|ing)"
      - "at scale this (would|could) be"
    fix: >-
      State ONLY what the PoC demonstrated. The triager can multiply; the
      extrapolation hurts credibility.
    doc: docs/rules/P10.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P14
    title: Triager-simulation table embedded in the report
    group: E
    verdict: hard
    weight: 35
    any_of:
      - "payment assessment"
      - "likely payment"
      - "likely reward"
      - "estimated (payout|odds|reward)"
      - "probability of (payment|acceptance)"
    fix: >-
      Remove it. Telling the triager what outcome you expect either anchors their
      assessment or signals you are gaming the system. Neither helps.
    doc: docs/rules/P14.md
    origin_rows: 0
    evidence: none
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P17
    title: No attacker-win scenario
    group: E
    verdict: soft
    weight: 30
    any_of:
      - "no (fund loss|attacker profit|attacker win|extraction)"
      - "self[- ](harm|inflicted)"
      - "stuck (yield|funds) without"
      - "under[- ]distribution"
      - "griefing"
      - "denial of service"
      - "\\bdos\\b"
      - "no (financial )?(beneficiary|gain)"
    none_of:
      - "attacker (profits?|gains?|extracts?) \\d"
      - "net (profit|gain) of \\d"
      - "a third party (loses|is harmed)"
    fix: >-
      Identify the specific financial beneficiary and quantify the loss, or
      downgrade to Informational with "no demonstrated fund-loss path".
    doc: docs/rules/P17.md
    origin_rows: 6
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null

  - id: P19
    title: Headline impact contradicted by PoC evidence (SPAM line)
    group: E
    # STRUCTURAL, not co-occurrence. See engine::structural_match. The rule
    # requires: a headline loss claim, a proof section that shows only a
    # revert/panic/expected failure, and no assertion of persisted state. A
    # revert-based freeze described honestly in all three parts does not fire
    # hard; it fires as a note, because the claim and the evidence disagree and a
    # human should look.
    structural: p19_headline_vs_proof
    verdict: hard
    weight: 50
    fix: >-
      Reframe the title to match EXACTLY what the PoC proves, or rebuild the PoC to
      demonstrate the claimed impact. This is the SPAM boundary: the punishment is
      worse than rejection.
    doc: docs/rules/P19.md
    origin_rows: 1
    evidence: in_sample
    last_validated: "2026-10-10"
    fp_rate: null
