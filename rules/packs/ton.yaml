# TON (FunC, Tact) — ecosystem token pack.
#
# Part of a balanced set: see rules/packs/README.md. Do not add tokens here
# without adding comparable tokens to the other packs — an unbalanced pack set
# is a disclosure about the author, which is the thing this directory exists
# to prevent.

id: ton
ecosystem: "TON (FunC, Tact)"
tokens:
  - ".tact"
  - ".fc"
  - "tact"
  - "func"
  - "toncoin"
  - "jetton"
  - "blueprint"
  - "toncli"
path_globs:
  - "**/*.tact"
  - "contracts/**/*.fc"
  - "**/ton.config.ts"
  - "**/wrappers/"
test_markers:
  - "blueprint test"
  - "toncli run_tests"
  - "@testcase"
  - "Sandbox"
notes: >-
  TON contracts in FunC or Tact. Cell and message semantics differ enough from the EVM that the anti-patterns need their own vocabulary.
