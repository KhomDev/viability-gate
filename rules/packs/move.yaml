# Move (Aptos, Sui) — ecosystem token pack.
#
# Part of a balanced set: see rules/packs/README.md. Do not add tokens here
# without adding comparable tokens to the other packs — an unbalanced pack set
# is a disclosure about the author, which is the thing this directory exists
# to prevent.

id: move
ecosystem: "Move (Aptos, Sui)"
tokens:
  - ".move"
  - "aptos"
  - "sui"
  - "expected_failure"
  - "entry fun"
  - "public(friend)"
  - "Move.toml"
  - "friend"
path_globs:
  - "**/*.move"
  - "sources/**/*.move"
  - "**/Move.toml"
  - "**/Move.lock"
test_markers:
  - "aptos move test"
  - "sui move test"
  - "expected_failure"
  - "#[test]"
notes: >-
  Move modules. The #[expected_failure] test attribute is the canonical marker for an aborted-transaction test, which is why the aborted-transaction anti-patterns reference this pack.
