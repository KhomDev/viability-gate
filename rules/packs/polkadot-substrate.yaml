# Polkadot / Substrate (ink!) — ecosystem token pack.
#
# Part of a balanced set: see rules/packs/README.md. Do not add tokens here
# without adding comparable tokens to the other packs — an unbalanced pack set
# is a disclosure about the author, which is the thing this directory exists
# to prevent.

id: polkadot-substrate
ecosystem: "Polkadot / Substrate (ink!)"
tokens:
  - "ink!"
  - "#[ink("
  - "substrate"
  - "polkadot"
  - "pallets"
  - "sr25519"
  - "parity-scale-codec"
  - "wasm32-unknown-unknown"
path_globs:
  - "pallets/**/*.rs"
  - "runtime/**/*.rs"
  - "**/ink.toml"
  - "**/*.contract"
test_markers:
  - "cargo contract test"
  - "substrate-contracts-node"
  - "#[ink::test]"
  - "cargo test -p"
notes: >-
  Substrate pallets and ink! contracts. Included so the pack set is not bounded by the ecosystems that happen to appear in any one researcher's log.
