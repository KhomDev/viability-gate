# Vyper — ecosystem token pack.
#
# Part of a balanced set: see rules/packs/README.md. Do not add tokens here
# without adding comparable tokens to the other packs — an unbalanced pack set
# is a disclosure about the author, which is the thing this directory exists
# to prevent.

id: vyper
ecosystem: "Vyper"
tokens:
  - ".vy"
  - "vyper"
  - "@external"
  - "@nonpayable"
  - "@payable"
  - "@internal"
  - "titanoboa"
  - "boa"
path_globs:
  - "**/*.vy"
  - "contracts/**/*.vy"
  - "**/ape-config.yaml"
  - "**/boa/"
test_markers:
  - "boa test"
  - "pytest --fork"
  - "vyper compile"
  - "@deploy"
notes: >-
  Python-flavoured EVM contracts. Shares the EVM target with the Solidity pack but has a distinct token surface, so it is tracked separately.
