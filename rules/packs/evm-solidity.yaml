# EVM / Solidity — ecosystem token pack.
#
# Part of a balanced set: see rules/packs/README.md. Do not add tokens here
# without adding comparable tokens to the other packs — an unbalanced pack set
# is a disclosure about the author, which is the thing this directory exists
# to prevent.

id: evm-solidity
ecosystem: "EVM / Solidity"
tokens:
  - ".sol"
  - "solidity"
  - "evm"
  - "foundry"
  - "hardhat"
  - "solc"
  - "yul"
  - "abi.encode"
path_globs:
  - "**/*.sol"
  - "contracts/**/*.sol"
  - "src/**/*.sol"
  - "**/foundry.toml"
test_markers:
  - "forge test"
  - "forge script"
  - "hardhat test"
  - "SPDX-License-Identifier"
notes: >-
  Solidity contracts compiled for the EVM, built with Foundry or Hardhat. The largest pack by usage in the wild, which is exactly why it must not be the only one.
