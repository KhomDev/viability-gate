# Rust / Solana (Anchor) — ecosystem token pack.
#
# Part of a balanced set: see rules/packs/README.md. Do not add tokens here
# without adding comparable tokens to the other packs — an unbalanced pack set
# is a disclosure about the author, which is the thing this directory exists
# to prevent.

id: rust-solana
ecosystem: "Rust / Solana (Anchor)"
tokens:
  - ".rs"
  - "solana"
  - "anchor"
  - "anchor_lang"
  - "pubkey"
  - "cargo"
  - "solana-program"
  - "token-2022"
path_globs:
  - "**/*.rs"
  - "programs/**/*.rs"
  - "**/Anchor.toml"
  - "**/Cargo.toml"
test_markers:
  - "anchor test"
  - "cargo test"
  - "solana-test-validator"
  - "solana_program::"
notes: >-
  Anchor and native Solana programs. Rust is also the host language of this tool, so the pack token list deliberately excludes generic Rust syntax that appears in ordinary source files.
