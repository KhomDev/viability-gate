# Cosmos SDK / Go — ecosystem token pack.
#
# Part of a balanced set: see rules/packs/README.md. Do not add tokens here
# without adding comparable tokens to the other packs — an unbalanced pack set
# is a disclosure about the author, which is the thing this directory exists
# to prevent.

id: cosmos-go
ecosystem: "Cosmos SDK / Go"
tokens:
  - ".go"
  - "cosmos-sdk"
  - "ibc"
  - "keeper"
  - "sdk.Msg"
  - "protobuf"
  - "golang"
  - "msgServer"
path_globs:
  - "**/*.go"
  - "x/**/*.go"
  - "**/go.mod"
  - "**/*.proto"
test_markers:
  - "go test"
  - "testify"
  - "func Test"
  - "suite.Run"
notes: >-
  Cosmos SDK modules. Message handlers and keepers are the scoped surface, so path globs point at x/ rather than the whole module tree.
