# Cairo / Starknet — ecosystem token pack.
#
# Part of a balanced set: see rules/packs/README.md. Do not add tokens here
# without adding comparable tokens to the other packs — an unbalanced pack set
# is a disclosure about the author, which is the thing this directory exists
# to prevent.

id: cairo
ecosystem: "Cairo / Starknet"
tokens:
  - ".cairo"
  - "cairo"
  - "starknet"
  - "scarb"
  - "snforge"
  - "felt252"
  - "ContractAddress"
  - "starknet-foundry"
path_globs:
  - "**/*.cairo"
  - "src/**/*.cairo"
  - "**/Scarb.toml"
  - "**/Scarb.lock"
test_markers:
  - "snforge test"
  - "scarb test"
  - "#[should_panic]"
  - "starknet-devnet"
notes: >-
  Starknet contracts and the Cairo test runner. felt252 arithmetic wraps, which is why overflow-adjacent anti-patterns carry a Cairo token here.
