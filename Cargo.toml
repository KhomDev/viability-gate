[package]
name = "viability-gate"
version = "0.2.0"
edition = "2021"
description = "Offline, deterministic pre-submission checker for smart-contract audit findings. Heuristic, in-sample calibrated."
license = "MIT"
repository = "https://github.com/KhomDev/viability-gate"
keywords = ["bug-bounty", "smart-contract", "audit", "triage", "security"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.85"

# Two binaries, same code: src/bin/vg.rs and src/bin/viability-gate.rs. "vg"
# collides with an unrelated bioinformatics tool of the same name, so both names
# ship and you can pick whichever does not collide on your PATH.

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
