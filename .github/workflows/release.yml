name: release

# Triggered by a tag matching v*, e.g. v0.2.0.
#
# Nothing here publishes to crates.io. That is a deliberate stop gate: the crate
# name is claimed permanently and the action is irreversible. Publishing is a
# separate, manual decision; see docs/install.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Refuse to build a release whose tag does not match the crate version, or
  # whose tests do not pass. A release that fails its own test suite is worse
  # than no release.
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the Cargo.toml version
        id: version
        shell: bash
        run: |
          set -eu
          tag="${{ github.ref_name }}"
          version=$(grep -E '^version' Cargo.toml | head -n1 | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "v$version" != "$tag" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "tag $tag matches Cargo.toml version $version"

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --release

  build:
    name: build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - name: Install the cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -eu
          version="${{ needs.verify.outputs.version }}"
          name="viability-gate-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/vg.exe" "dist/$name/"
            cp "target/${{ matrix.target }}/release/viability-gate.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/vg" "dist/$name/"
            cp "target/${{ matrix.target }}/release/viability-gate" "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd "$name" && 7z a "../$name.zip" . >/dev/null)
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - name: Checksums
        shell: bash
        run: |
          set -eu
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ./* > SHA256SUMS
          else
            shasum -a 256 ./* > SHA256SUMS
          fi
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish the release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every artifact
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Merge the checksum files
        shell: bash
        run: |
          set -eu
          cd dist
          rm -f SHA256SUMS
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          else
            shasum -a 256 ./*.tar.gz ./*.zip > SHA256SUMS
          fi
          echo "--- release contents ---"
          ls -l
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## viability-gate ${{ needs.verify.outputs.version }}

            Two binaries are included: vg and viability-gate. They are the same
            program. vg collides with an unrelated bioinformatics tool of the
            same name, so viability-gate is the safe choice. See docs/install.md.

            Verify the download before running it:

                sha256sum -c SHA256SUMS --ignore-missing
                gh attestation verify <asset> --repo KhomDev/viability-gate

            What this release does not claim: the catalog is calibrated
            in-sample against one researcher's rejection log, and its
            false-positive rate is unmeasured. Read docs/calibration.md before
            trusting a verdict.
