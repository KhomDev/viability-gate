---
name: Bug report
description: Something in the tool, the rules or the docs is wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two things to know before you file:

        **Do not paste a finding from a live program.** Rule matches are run
        against finding text; if you paste yours, you may be publishing under an
        embargo. Reduce it to the smallest synthetic snippet that reproduces the
        behaviour.

        **This tool ships no data.** It has no program names, chains or reward
        tables, so there is nothing to correct on that front — but if you believe
        a rule names a target, that is a serious report and this is the place
        for it.

  - type: dropdown
    id: area
    attributes:
      label: What is wrong?
      options:
        - A rule fires on a finding it should not (false positive)
        - A rule does not fire on a finding it should (false negative)
        - The CLI behaves differently from the docs
        - The docs state something the tool does not do
        - A number in the docs does not match a command's output
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `vg --version`
      placeholder: "viability-gate 0.2.0"
    validations:
      required: true

  - type: input
    id: command
    attributes:
      label: The exact command you ran
      placeholder: "vg check finding.md --json"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true

  - type: textarea
    id: snippet
    attributes:
      label: A synthetic snippet that reproduces it
      description: |
        Rewrite it. Do not paste a real finding. If the report is about a rule
        firing, the snippet needs to contain the phrase that matched.
      render: markdown
    validations:
      required: false
