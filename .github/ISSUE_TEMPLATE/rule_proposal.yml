---
name: Rule proposal
description: Propose a new anti-pattern, or a change to an existing one
title: "[rule] "
labels: ["rules"]
body:
  - type: markdown
    attributes:
      value: |
        Rules are the product. A rule is accepted on evidence, not on
        plausibility.

        **The bar:** a rule needs a real cited example — a rejection you can
        describe without naming the program — plus a positive and a negative
        test case. A rule with no example is a hypothesis, and the catalog
        already has enough of those.

        **Do not name a target.** No program, no platform, no repository, no
        chain. A rule that names one is a disclosure and will be closed. The
        test suite enforces this.

  - type: dropdown
    id: kind
    attributes:
      label: What are you proposing?
      options:
        - A new anti-pattern
        - A change to an existing anti-pattern's patterns
        - A change to an existing anti-pattern's escape hatch
        - A change to a gate
    validations:
      required: true

  - type: input
    id: id
    attributes:
      label: Rule id
      description: An existing P-number, or "new" for a proposal
      placeholder: "P17"
    validations:
      required: true

  - type: textarea
    id: shape
    attributes:
      label: The shape of the rejection
      description: |
        Describe the mechanism, not the target. If you need a real symbol, say
        what role it plays instead.
    validations:
      required: true

  - type: textarea
    id: positive
    attributes:
      label: A synthetic finding the rule must fire on
    validations:
      required: true

  - type: textarea
    id: negative
    attributes:
      label: A synthetic finding it must NOT fire on
      description: |
        This is the half most proposals skip, and it is the half that decides
        whether the rule survives. Give the closest case that should pass.
    validations:
      required: true

  - type: textarea
    id: falsepositives
    attributes:
      label: Where you expect it to over-fire
      description: |
        Every rule in the catalog has a "known false-positive modes" section on
        its page. What would yours say?
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: This proposal names no target, program, platform or chain
          required: true
        - label: I have read the existing rule page for this id
          required: true
