# Known-issues corpus — FICTIONAL EXAMPLE
#
# This is the one input that catches duplicates, which are the largest single
# rejection category. A duplicate cannot be found by pattern-matching a finding's
# prose, because the signal lives in an external corpus: the program's own
# known-issues section and its prior-audit findings. The tool ships no such
# corpus — you transcribe it for the program you are hunting.
#
# Everything below is invented. No real program's known issues appear here.
#
# HOW TO BUILD YOUR OWN
#
#   1. Read the program's known-issues section. Copy each entry verbatim.
#   2. Read every linked prior-audit report. Extract the issues the team
#      ACKNOWLEDGED or marked "won't fix" — those are the ones still present in
#      the code and still excluded.
#   3. For each, write one or two regexes that would match a finding describing
#      that behaviour. Aim for the mechanism, not the identifier: "burned amount
#      persists across re-lock" matches a re-description; a function name does not.
#   4. Run `vg check finding.md --known-issues my-known-issues.yaml` before you
#      write the PoC.
#
# A match is reported as a HARD fail with rule id `KI:<id>`, because a known
# issue is Not Applicable rather than Informational — a materially worse outcome
# than an unpaid finding.

known_issues:
  - id: KI-EXAMPLE-1
    summary: "Rounding in share calculation favours the protocol; accepted as intended"
    source: "https://example.invalid/audit-2025.pdf, finding M-01"
    patterns:
      - "round(ing|s)? .{0,40}(favou?rs?|benefits?) the protocol"
      - "share (calculation|math).{0,30}round"
      - "dust.{0,30}(stuck|stranded|unclaimable)"

  - id: KI-EXAMPLE-2
    summary: "Withdrawal queue block on a reverting receive hook; accepted as a known limitation"
    source: "program known-issues section, 2026-01-01"
    patterns:
      - "withdrawal queue.{0,40}(block|stuck|stall)"
      - "receive (hook|function).{0,40}revert"
      - "ETH receive.{0,30}fail"

  - id: KI-EXAMPLE-3
    summary: "Enable flag gates claims but not accrual; intentional for determinism on re-enable"
    source: "https://example.invalid/audit-2025.pdf, finding L-04"
    patterns:
      - "(enable|enabled) flag.{0,40}(accru|claim)"
      - "accru.{0,30}(continue|resume).{0,30}(disabled|re-?enable)"

  - id: KI-EXAMPLE-4
    summary: "Admin may pause operations; intended and documented"
    source: "program docs, admin section"
    patterns:
      - "pause.{0,40}(permanent|brick|unrecoverable|lock)"
      - "(pause|unpause).{0,30}(no|without).{0,30}(resume|unpause)"

# A note on specificity, because this file is easy to get wrong in both
# directions:
#
#   TOO BROAD   "reward"                  -> fires on half of all findings
#   TOO NARROW  "vault.move:552"          -> fires on nothing you will write
#
# The right level names the MECHANISM in words a different author would also use
# when describing the same behaviour. If you cannot phrase it that way, you
# probably do not yet understand the known issue well enough to avoid it.
