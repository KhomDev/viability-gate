# Gate mapping — which logged gate token a fired anti-pattern is a statement about.
#
# This file contains no targets. It maps the anti-pattern catalog (P1..P22) onto
# the gate vocabulary used by the rejection log, so a calibration run can compare
# "what the tool flagged" with "what the log says actually decided it".
#
# PROVENANCE — read this before quoting any number derived from this file.
#
#   The published in-sample calibration (docs/calibration.md) was scored with a
#   mapping that lived in the researcher's private harness. That harness read the
#   private rejection log and is not reproducible. This file is the public
#   restatement of that mapping, authored from (a) the semantics of each rule in
#   rules/anti-patterns.yaml and (b) the public gate vocabulary documented in
#   rejection-taxonomy/data/SCHEMA.md. It is a JUDGEMENT, not a re-derivation:
#   it has not been validated against the private dataset, and it cannot be,
#   because the dataset is not published.
#
#   A run of tools/calibrate/ using this file therefore reproduces the METHOD of
#   the published result, not the result. That is why docs/calibration.md reports
#   the published numbers as in-sample and does not present them as reproducible.
#
# HOW IT IS USED
#
#   A rule fires  ->  rules.<id> lists the gate token(s) that firing is a
#   statement about. Two metrics follow:
#
#     strict  the deciding gate token is among the flagged tokens
#     lenient at least one flagged rule maps to any gate at all
#     miss    no fired rule maps to any gate
#
#   A rule with an empty list is a report-quality pattern: it has no gate, so a
#   finding that fires only those scores as a miss. That is a property of the
#   metric, not a bug in the rule.

version: 1

# Gate tokens the catalog can reach, by construction of the mapping below.
reachable_tokens:
  - G1_severity_floor
  - G2_exclusion_clause
  - G3_scope_tree
  - G4_prior_audit
  - G5_test_intent
  - design_review
  - program_ceiling
  - P7_best_practice
  - P12_no_persisted_impact
  - P16_below_floor
  - P17_no_attacker_win
  - P18_design_tradeoff
  - P19_headline_mismatch
  - P20_cooperating_party
  - REALISM

# Gate tokens that no rule can reach, because the signal lives outside the
# finding's prose — in the program's known-issues list or its published audits.
# This is the structural ceiling documented in docs/calibration.md.
external_corpus_tokens:
  - D1_duplicate_check
  - P2_duplicate_check
  - G4_prior_audit

rules:
  P1:  [design_review]            # the impact does not exist -> no-impact review
  P2:  [G2_exclusion_clause]      # privileged-role exclusions are the largest sub-case
  P3:  [G2_exclusion_clause]      # front-running and delay dependencies are exclusions
  P4:  []                         # report-quality: defective PoC has no gate
  P5:  [G3_scope_tree]            # root cause outside the scoped tree
  P6:  [REALISM]                  # future-state framing is an attacker-model failure
  P7:  [P7_best_practice]         # best-practice critique
  P8:  []                         # report-quality: self-contradiction has no gate
  P9:  []                         # report-quality: wrong line numbers have no gate
  P10: []                         # report-quality: extrapolated tables have no gate
  P11: [REALISM]                  # testnet-only is a realism/attacker-model failure
  P12: [P12_no_persisted_impact]  # revert-only
  P13: [design_review]            # unquantified "inconsistent state" -> no demonstrated impact
  P14: []                         # report-quality: triager-simulation tables have no gate
  P15: [G5_test_intent]           # the project's own tests assert the behaviour
  P16: [P16_below_floor, G1_severity_floor]
  P17: [P17_no_attacker_win]      # no net-positive extraction
  P18: [P18_design_tradeoff, G4_prior_audit]
  P19: [P19_headline_mismatch]    # headline contradicted by the PoC
  P20: [P20_cooperating_party]    # a second party must act
  P21: [REALISM]                  # configuration mismatch
  P22: [REALISM]                  # primitive with no deployed consumer

# Why each mapping is what it is. Empty lists are deliberate.
notes:
  P1: "A report that admits the impact does not exist is a no-impact review, which is the design_review bucket."
  P2: "The log's largest out-of-scope sub-cause is the privileged-role exclusion clause."
  P3: "Front-running and operator-delay findings are closed by the program's race-condition exclusion."
  P4: "No gate. The published calibration counts defective-PoC fires as misses; this is the mapping that makes that true."
  P5: "Root cause outside the scoped tree is exactly G3."
  P6: "Framing the harm in a future version is an attacker-model failure, which is what REALISM covers."
  P7: "The log carries its own P7 token; mapped directly."
  P8: "No gate. A self-contradicting report is a report-quality failure."
  P9: "No gate. Wrong line references are a report-quality failure."
  P10: "No gate. Extrapolated tables are a report-quality failure."
  P11: "A testnet-only reproduction is an attacker-model / realism failure."
  P12: "The log carries its own P12 token; mapped directly."
  P13: "An invariant violation with no quantified delta is a no-demonstrated-impact finding, which is the design_review bucket."
  P14: "No gate. A payout-prediction table is a report-quality failure."
  P15: "The log carries G5; a test that asserts the behaviour is the intent signal."
  P16: "The log carries both a P16 token and G1; a severity-floor rejection satisfies either."
  P17: "The log carries its own P17 token; mapped directly."
  P18: "The log carries a P18 design-tradeoff token, and a finding that admits a prior audit is also a G4 hit. The published calibration scored the prior-audit class as 0%, so the private mapping did not credit G4; this file credits both and says so."
  P19: "The log carries its own P19 token; mapped directly."
  P20: "The log carries its own P20 token; mapped directly."
  P21: "Configuration mismatch is one of the post-mortem realism gates."
  P22: "Primitive-with-no-consumer is one of the post-mortem realism gates."
